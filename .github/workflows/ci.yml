name: CI

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'VERSION'
      - '.github/workflows/**'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      # Windows 默认 cp1252，脚本 help 含中文会 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Byte-compile
        run: python -m py_compile export_we_wallpaper.py
      - name: Help smoke (no NVENC required)
        run: python export_we_wallpaper.py --help
